<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>T2Dcare RAG Dashboard</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0f1115;
        color: #e6e6e6;
        margin: 0;
        padding: 24px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 4px;
      }
      .subtitle {
        color: #9aa0a6;
        margin-bottom: 24px;
        font-size: 14px;
      }
      .input-row {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
      }
      input[type="text"] {
        flex: 1;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #333;
        background: #1a1d23;
        color: #eee;
        font-size: 14px;
      }
      button {
        padding: 10px 18px;
        border-radius: 8px;
        border: none;
        background: #4f7cff;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #3a63e0;
      }
      button:disabled {
        background: #555;
        cursor: not-allowed;
      }
      .step {
        background: #1a1d23;
        border: 1px solid #2a2d35;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .step h2 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #9aa0a6;
        margin: 0 0 12px 0;
      }
      .chunk-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 10px;
        border-radius: 6px;
        margin-bottom: 6px;
        background: #14161b;
        font-size: 13px;
      }
      .chunk-row.selected {
        border: 1px solid #4f7cff;
        background: #182236;
      }
      .chunk-id {
        font-family: monospace;
        color: #7fb2ff;
      }
      .distance {
        font-family: monospace;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 13px;
      }
      .badge.pass {
        background: #1e3f2a;
        color: #4ade80;
        border: 1px solid #2d5a3d;
      }
      .badge.fail {
        background: #402020;
        color: #f87171;
        border: 1px solid #5a2d2d;
      }
      .answer-box {
        background: #14161b;
        border-radius: 8px;
        padding: 14px;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
      }
      .follow-up {
        margin-top: 10px;
        padding: 10px;
        border-radius: 8px;
        background: #2a2510;
        border: 1px solid #4d4420;
        color: #e0c65a;
        font-size: 13px;
      }
      .meta {
        font-size: 12px;
        color: #9aa0a6;
        margin-top: 6px;
      }
      .loading {
        color: #9aa0a6;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>T2Dcare RAG Pipeline Dashboard</h1>
      <div class="subtitle">
        Question → Retrieved chunks → Selected chunk → Validation → Answer
      </div>

      <div class="input-row">
        <input
          type="text"
          id="questionInput"
          placeholder="Ask a question about type 2 diabetes management..."
        />
        <button id="askBtn" onclick="ask()">Ask</button>
      </div>

      <div id="results"></div>
    </div>

    <script>
      const API_URL = "http://127.0.0.1:8000/chat";
      const SESSION_ID =
        "dashboard-session-" + Math.random().toString(36).slice(2, 8);

      async function ask() {
        const input = document.getElementById("questionInput");
        const btn = document.getElementById("askBtn");
        const question = input.value.trim();
        if (!question) return;

        btn.disabled = true;
        document.getElementById("results").innerHTML =
          '<div class="step"><span class="loading">Running pipeline...</span></div>';

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: SESSION_ID, message: question }),
          });
          const data = await res.json();
          render(data, question);
        } catch (err) {
          document.getElementById("results").innerHTML =
            `<div class="step"><span style="color:#f87171">Error: ${err.message}. Is the server running on ${API_URL}?</span></div>`;
        } finally {
          btn.disabled = false;
        }
      }

      function render(data, question) {
        const trace = data.trace || {};
        const validation = trace.validation || {};
        const chunks = trace.retrieved_chunks || [];
        const selectedId = trace.selected_chunk_id;

        let chunksHtml = chunks
          .map((c) => {
            const isSelected = c.chunk_id === selectedId;
            return `<div class="chunk-row ${isSelected ? "selected" : ""}">
      <span class="chunk-id">${c.chunk_id} ${isSelected ? "⭐ selected" : ""}</span>
      <span>page ${c.page === -1 ? "?" : c.page}</span>
      <span class="distance">distance: ${c.distance.toFixed(4)}</span>
    </div>`;
          })
          .join("");

        const passed = validation.passed;
        const badgeHtml = `<span class="badge ${passed ? "pass" : "fail"}">${passed ? "✓ PASS" : "✗ FAIL"}</span>`;

        document.getElementById("results").innerHTML = `
    <div class="step">
      <h2>1. Question</h2>
      <div class="answer-box">${escapeHtml(question)}</div>
    </div>

    <div class="step">
      <h2>2. Retrieved Chunks (top ${chunks.length})</h2>
      ${chunksHtml || "<div class='meta'>No chunks retrieved.</div>"}
    </div>

    <div class="step">
      <h2>3. Selected Chunk (sent to LLM)</h2>
      <div class="meta">${selectedId ? selectedId : "None — validation failed, no chunk was used"}</div>
    </div>

    <div class="step">
      <h2>4. Validation</h2>
      ${badgeHtml}
      <div class="meta">
        best distance = ${validation.best_distance != null ? validation.best_distance.toFixed(4) : "n/a"}
        &nbsp;|&nbsp; threshold = ${validation.threshold}
      </div>
    </div>

    <div class="step">
      <h2>5. Answer</h2>
      <div class="answer-box">${escapeHtml(data.message || "")}</div>
      ${data.follow_up ? `<div class="follow-up">💬 Follow-up: ${escapeHtml(data.follow_up)}</div>` : ""}
    </div>
  `;
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      document
        .getElementById("questionInput")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") ask();
        });
    </script>
  </body>
</html>
